<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AshSpire Modpack Download</title>
    
    <!-- Import a Minecraft-like Font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'VT323', monospace;
            overflow: hidden;
            background-color: #1a1a1a; 
        }

        body::before {
            content: "";
            position: fixed;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            filter: blur(8px) brightness(0.5); 
            z-index: -1;
        }

        .logo-container {
            margin-bottom: 40px;
            max-width: 90%;
        }

        .logo-img {
            max-width: 600px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            animation: bob 3s infinite ease-in-out;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .button-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mc-btn {
            position: relative;
            display: inline-block;
            min-width: 220px;
            padding: 15px 10px;
            text-decoration: none;
            color: #e0e0e0;
            font-size: 28px;
            text-align: center;
            text-shadow: 2px 2px 0px #3f3f3f;
            cursor: pointer;
            background-color: #7d7d7d; 
            border: 2px solid;
            border-color: #fff #555 #555 #fff;
            box-shadow: inset -2px -2px 0px #555, inset 2px 2px 0px #fff, 0px 6px 0px #00000050;
            transition: transform 0.1s;
        }

        .mc-btn:hover {
            background-color: #6e85a8;
            color: #ffffa0;
        }

        .mc-btn:active {
            transform: translateY(4px);
            box-shadow: inset -2px -2px 0px #555, inset 2px 2px 0px #fff, 0px 2px 0px #00000050;
        }

        .mc-btn.disabled {
            background-color: #555;
            color: #888;
            border-color: #777 #333 #333 #777;
            pointer-events: none;
            text-shadow: none;
        }

        .filename-label {
            display: block;
            margin-top: 8px;
            font-size: 18px;
            color: #ddd;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="Modpack Logo" class="logo-img">
    </div>

    <div class="button-container">
        
        <!-- ZIP BUTTON -->
        <div>
            <a id="btn-zip" class="mc-btn disabled" href="#">
                Loading...
            </a>
            <span id="text-zip" class="filename-label"></span>
        </div>

        <!-- MRPACK BUTTON -->
        <div>
            <a id="btn-mrpack" class="mc-btn disabled" href="#">
                Loading...
            </a>
            <span id="text-mrpack" class="filename-label"></span>
        </div>

        <!-- PRISM INSTANCE BUTTON -->
        <div>
            <a id="btn-prism" class="mc-btn disabled" href="#">
                Loading...
            </a>
            <span id="text-prism" class="filename-label"></span>
        </div>

    </div>

    <script>
        const githubUsername = "ConJaBst";
        const repoName = "AshSpire";

        const apiUrl = `https://api.github.com/repos/${githubUsername}/${repoName}/contents/`;

        const btnZip = document.getElementById('btn-zip');
        const textZip = document.getElementById('text-zip');

        const btnMrpack = document.getElementById('btn-mrpack');
        const textMrpack = document.getElementById('text-mrpack');

        const btnPrism = document.getElementById('btn-prism');
        const textPrism = document.getElementById('text-prism');

        fetch(apiUrl)
            .then(res => {
                if (!res.ok) throw new Error('Repo not found');
                return res.json();
            })
            .then(data => {

                // ZIP (exclude PrismInstance.zip)
                const zipFile = data.find(item => 
                    item.name.endsWith('.zip') && item.name !== 'PrismInstance.zip'
                );

                if (zipFile) {
                    btnZip.href = zipFile.download_url;
                    btnZip.innerText = "DOWNLOAD ZIP";
                    btnZip.classList.remove('disabled');
                    textZip.innerText = zipFile.name;
                } else {
                    btnZip.innerText = "NO ZIP FOUND";
                }

                // MRPACK
                const mrpackFile = data.find(item => item.name.endsWith('.mrpack'));

                if (mrpackFile) {
                    btnMrpack.href = mrpackFile.download_url;
                    btnMrpack.innerText = "DOWNLOAD MRPACK";
                    btnMrpack.classList.remove('disabled');
                    textMrpack.innerText = mrpackFile.name;
                } else {
                    btnMrpack.innerText = "NO MRPACK FOUND";
                }

                // PRISM INSTANCE (exact match)
                const prismFile = data.find(item => item.name === 'PrismInstance.zip');

                if (prismFile) {
                    btnPrism.href = prismFile.download_url;
                    btnPrism.innerText = "DOWNLOAD PRISM INSTANCE";
                    btnPrism.classList.remove('disabled');
                    textPrism.innerText = prismFile.name;
                } else {
                    btnPrism.innerText = "NO PRISM INSTANCE";
                }
            })
            .catch(err => {
                console.error(err);
                btnZip.innerText = "ERROR";
                btnMrpack.innerText = "ERROR";
                btnPrism.innerText = "ERROR";
            });
    </script>

</body>
</html>
